services:
  app:
    build: .
    ports:
      - "9095:9095"
    environment:
      APP_PROFILE: dev
      SERVER_PORT: 9095
      DB_URL: jdbc:mysql://db:3306/aicodereview?useSSL=false&serverTimezone=UTC
      DB_USERNAME: aicodereview
      DB_PASSWORD: ${DB_PASSWORD:-local-development-password}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: aicodereview
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_USER: aicodereview
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
