spring:
  datasource:
    url: jdbc:h2:mem:aicodereview;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-only

  flyway:
    enabled: false

ai:
  provider: gemini

  gemini:
    api-key: dummy-api-key
    endpoint: https://dummy-url

jwt:
  secret: dGVzdC1vbmx5LWtleS1mb3ItdGVzdC1vbmx5LWtleS1mb3I=
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

cors:
  allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN