spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 0
      connection-timeout: 30000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:50}
      min-spare: 5

jwt:
  secret: ${JWT_SECRET}

ai:
  gemini:
    api-key: ${GOOGLE_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.anwar.aicodereview: INFO
